
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vite-react-dev
    # Vite dev server + HMR
    command: yarn dev --host --port 5173
    ports:
      - "5173:5173"     # Vite dev server
      - "24678:24678"   # Vite HMR websocket (Vite auto-selects; mapping helps in some envs)
    environment:
      # Fix file watching across Docker/WSL/VMs
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
      # If your app reads VITE_ vars, you can pass them here or from .env
      - VITE_API_BASE_URL=http://cosmic:3000
    volumes:
      # Bind-mount your source for live reload
      - .:/app
      # Keep node_modules in container to avoid OS conflicts & speed up installs
      - /app/node_modules
    # For Yarn Berry zero-install, optionally persist .yarn cache:
    #   - ./.yarn:/app/.yarn
    #   - ./.yarn/cache:/app/.yarn/cache
    # If you need specific user permissions on Linux:
    # user: "${UID:-1000}:${GID:-1000}"
    networks:
      - cosmic_net


networks:
  cosmic_net:
    driver: bridge
